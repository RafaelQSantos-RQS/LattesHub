services:
  # Banco de Dados (PostgreSQL + pgvector)
  db:
    build:
      context: ./database
      network: host
    container_name: latteshub-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - latteshub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks:
      - latteshub_network

  # ETL - Apache Hop
  hop:
    image: apache/hop:2.17.0
    container_name: latteshub-etl
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - etl
    restart: "no"
    volumes:
      - ./database/apache_hop:/project
      - ./database/data:/project/data
    env_file:
      - .env
    environment:
      HOP_PROJECT_FOLDER: /project
      HOP_PROJECT_NAME: LattesHub
      HOP_FILE_PATH: /project/metadata/workflows/workflow_master.hwf
      HOP_RUN_CONFIG: local
      HOP_LOG_LEVEL: Basic
      HOP_CUSTOM_ENTRYPOINT_EXTENSION_SHELL_FILE_PATH: /project/docker/create-hop-env.sh
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /tmp/latteshub-hop-env.json
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - latteshub_network

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      network: host
    container_name: latteshub-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - latteshub_network

  embeddings:
    build:
      context: ./backend
      network: host
    container_name: latteshub-embeddings
    profiles:
      - etl
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      hop:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["python", "app/scripts/gerar_embeddings.py"]
    networks:
      - latteshub_network

volumes:
  latteshub_pg_data:
    name: latteshub_pg_data

networks:
  latteshub_network:
    name: latteshub_network
