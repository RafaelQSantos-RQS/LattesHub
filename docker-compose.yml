services:
  db:
    build: ./database

    container_name: latteshub_db

    restart: always

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    ports:
      - "${DB_PORT_EXTERNAL}:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

  hop:
    image: apache/hop:latest
    container_name: lattes_hub_etl
    depends_on:
      - db
    volumes:
      - ./database/apache_hop:/project
    environment:
      - HOP_PROJECT_DIRECTORY=/project
      - HOP_PROJECT_NAME=LattesHub
      - HOP_RUN_WORKFLOW=/project/metadata/workflows/workflow_master.hwf
      - HOP_RUN_CONFIG=local
      - HOP_LOG_LEVEL=Basic

volumes:
  pg_data:
