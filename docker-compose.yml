services:
  db:
    build: ./database

    container_name: latteshub_db

    restart: always

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    ports:
      - "${DB_PORT_EXTERNAL}:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
