<div class="flex-1 flex flex-col items-center justify-center w-full py-8 md:py-12 px-4 md:px-6">
<!-- Abstract Background Pattern (Non-image) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] overflow-hidden">
  <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern height="40" id="dots" patternunits="userSpaceOnUse" width="40" x="0" y="0">
        <circle class="text-on-background" cx="2" cy="2" fill="currentColor" r="1.5"></circle>
      </pattern>
    </defs>
    <rect fill="url(#dots)" height="100%" width="100%"></rect>
  </svg>
</div>
<!-- Center Search Cluster -->
<div class="w-full max-w-4xl relative z-10 flex flex-col items-center">
  <div class="mb-8 md:mb-12 text-center">
    <h1 class="font-headline-md text-primary mb-4" style="font-size: clamp(22px, 5vw, 32px); line-height: 1.25;">Descubra a ciência global.</h1>
    <p class="font-body-lg text-on-surface-variant max-w-2xl mx-auto" style="font-size: clamp(15px, 3vw, 18px);">Acesse metadados de pesquisadores e produções científicas mundiais através de busca semântica inteligente.</p>
  </div>
  
  <app-search-box class="w-full"></app-search-box>

  <div class="mt-6 flex items-center gap-3">
    <span class="material-symbols-outlined text-data-teal" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
    <p class="font-data-label text-data-label text-on-surface-variant italic">
      Busca por similaridade semântica suportada por embeddings de IA.
    </p>
  </div>
  
  <!-- Bento-style Quick Access -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter mt-12 md:mt-24 w-full">
    <app-stats-card icon="dataset" title="Produções Científicas" [value]="totalProducoes()" description="Artigos, eventos, livros e capítulos indexados."></app-stats-card>
    <app-stats-card icon="group" title="Pesquisadores" [value]="totalPesquisadores()" description="Cientistas com currículo Lattes integrado."></app-stats-card>
    <app-stats-card icon="account_balance" title="Instituições" [value]="totalInstituicoes()" description="Centros de ensino e pesquisa mapeados."></app-stats-card>
  </div>
</div>
</div>
