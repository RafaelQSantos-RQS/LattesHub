<div class="w-full bg-white shadow-sm border border-slate-200 p-2 rounded-xl focus-within:ring-2 focus-within:ring-primary-fixed-dim transition-all duration-300"
     [class.scale-[1.01]]="isFocused()">
  <div class="flex items-center gap-2 md:gap-4 px-2 md:px-4">
    <span class="material-symbols-outlined text-slate-800 text-[24px] md:text-[28px] shrink-0">search</span>
    <input class="w-full min-w-0 py-3 md:py-4 bg-transparent border-none focus:ring-0 text-body-md md:text-body-lg font-body-md md:font-body-lg text-on-surface placeholder:text-outline-variant outline-none"
           placeholder="Ex: Pesquisadores de IA aplicada à saúde na Bahia"
           type="text"
           aria-label="Busca semântica"
           [value]="query()"
           (input)="onQueryInput($event)"
           (focus)="isFocused.set(true)"
           (blur)="isFocused.set(false)"
           (keyup.enter)="onSearch()"/>
    <button class="shrink-0 bg-slate-900 text-white px-4 md:px-8 py-2.5 md:py-3 rounded-lg font-label-bold text-label-bold hover:bg-primary transition-colors active:scale-95 duration-100"
            [class.opacity-50]="query().trim().length < minSearchLength"
            [disabled]="query().trim().length < minSearchLength"
            (click)="onSearch()">
      Buscar
    </button>
  </div>
</div>
