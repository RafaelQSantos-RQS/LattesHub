<div class="bg-white border border-slate-200 p-6 rounded-lg hover:shadow-md transition-shadow h-full">
  <span class="material-symbols-outlined text-primary mb-4">{{ icon() }}</span>
  <h3 class="font-label-bold text-label-bold text-primary uppercase tracking-wider mb-2">{{ title() }}</h3>
  <p class="font-data-label text-[24px] text-primary">{{ value() }}</p>
  <p class="font-body-sm text-body-sm text-on-surface-variant">{{ description() }}</p>
</div>
